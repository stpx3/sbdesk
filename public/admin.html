<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=IBM+Plex+Mono:wght@500;700&family=Libre+Caslon+Display&display=swap" rel="stylesheet">
<meta name="theme-color" content="#050505">
<title>SB Desk · Admin</title>
<style>
:root{--navy:#0b2f5c;--ink:#0f1a24;--muted:#5d6b78;--line:#d6dde6;--soft:#f3f6fa;--card:#fff;--bg:#e9edf2;--up:#0a7a2f;--gold:#f5c542;--mono:"Courier New",Courier,monospace;--ui:Verdana,Geneva,Tahoma,sans-serif;--serif:Georgia,"Times New Roman",serif}
body.dark{--navy:#1e1e1e;--ink:#d8d8d8;--muted:#8a8a8a;--line:#2a2a2a;--soft:#0b0b0b;--card:#000;--bg:#050505;--up:#22d34a;--gold:#ffb000;--serif:Consolas,"Courier New",monospace;--mono:Consolas,"Courier New",monospace;--ui:Tahoma,Verdana,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--ui)}
.page{max-width:860px;margin:0 auto;background:var(--card);min-height:100vh;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--navy);color:#fff}
.top b{font:700 21px var(--serif)}.top small{font:11px var(--mono);color:#9fb6d6;letter-spacing:.06em}
.top a{margin-left:auto;color:#d5e2f3;text-decoration:none;font-size:14px}
.wrap{padding:20px 18px 40px}
.new{display:block;text-align:center;padding:16px;background:var(--up);color:#fff;font:700 18px var(--ui);text-decoration:none;border-radius:3px}
h2{font:700 18px var(--serif);margin:28px 0 4px}
.hint{margin:0 0 12px;color:var(--muted);font-size:13.5px}
.row{display:grid;grid-template-columns:120px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.when{font:13px var(--mono);color:var(--muted)}
.ttl{font-weight:700}.tfs{font:12px var(--mono);color:var(--muted)}
.ok{font:700 11px var(--mono);color:var(--up);border:1px solid var(--up);padding:0 4px;margin-left:6px}
.btn{padding:10px 14px;border:1px solid var(--up);color:var(--up);font:700 14px var(--ui);text-decoration:none;white-space:nowrap;border-radius:3px}
.btn:hover{background:var(--soft)}
.empty{padding:20px 0;color:var(--muted)}
body.wait .page{visibility:hidden}
.who{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 16px;font-size:13.5px;color:var(--muted)}
.who button{background:none;border:1px solid var(--line);color:var(--ink);padding:6px 12px;cursor:pointer;font:13px var(--ui);border-radius:3px}
.mig{margin:0 0 18px;padding:12px 14px;border:1px solid var(--gold);background:var(--soft);font-size:14px}
.mig button{margin-top:8px;padding:10px 14px;font:700 14px var(--ui);background:var(--gold);color:#000;border:0;cursor:pointer;border-radius:3px}
.err{color:#ff4545}
.sg{padding:12px 0;border-bottom:1px solid var(--line)}
.sg .meta{font:12px var(--mono);color:var(--muted);display:flex;justify-content:space-between;gap:10px}
.sg p{margin:6px 0 0;white-space:pre-wrap}
.sg button{background:none;border:0;color:var(--muted);cursor:pointer;font:12px var(--ui);text-decoration:underline}
#sugN{font:700 13px var(--mono);color:var(--gold)}
.rq{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.rq .meta{font:12px var(--mono);color:var(--muted)}.rq .em{font-weight:700}
.rq .acts{display:flex;gap:8px}
.rq button{padding:9px 12px;font:700 13px var(--ui);border-radius:3px;cursor:pointer;border:1px solid var(--line);background:none;color:var(--ink)}
.acts2{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.xbtn{background:none;cursor:pointer;font:700 14px var(--ui)}
#baks a{display:inline-block;margin:4px 10px 4px 0;font:13px var(--mono);color:var(--gold)}
.rq button.yes{background:var(--up);border-color:var(--up);color:#000}
@media(max-width:620px){.rq{grid-template-columns:1fr}}
@media(max-width:620px){.row{grid-template-columns:1fr}.btn{text-align:center}}
.picov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:14px;overflow:auto}
.picbox{width:min(560px,100%);background:#0b0b0b;border:1px solid #333;padding:14px;display:flex;flex-direction:column;gap:10px}
.picbox img{width:100%;height:auto;display:block;border:1px solid #333;-webkit-touch-callout:default}
.picbox .btn{width:100%;text-align:center;justify-content:center;background:transparent;display:block;box-sizing:border-box;cursor:pointer}
.picbox [data-a=share]{background:var(--up);color:#000}
.picbox .hint{margin:0;font-size:13px;color:#999}
</style>
</head>
<body class="wait">
<div class="page">
  <header class="top"><b>SB Desk</b><small>ADMIN</small><a href="index.html">Desk →</a></header>
  <div class="wrap">
    <div class="who"><span id="who"></span><span><button type="button" id="bak">Backup objava</button> <button type="button" id="out">Odjava</button></span></div>
    <div class="mig" id="mig" hidden></div>
    <a class="new" href="publish.html">+ Nova analiza</a>
    <h2>After (kako je završilo)</h2>
    <p class="hint">Nađi analizu po datumu i klikni "Dodaj After".</p>
    <div id="list"></div>
    <h2>Prijedlozi posjetitelja <span id="sugN"></span></h2>
    <p class="hint">Ono što ljudi pošalju preko "Suggestions" na dnu stranice.</p>
    <div id="sugs"></div>
    <h2>Backup</h2>
    <p class="hint">Stranica sama sprema kopiju svih objava svaki dan (zadnjih 60 dana). Klik skida tu kopiju.</p>
    <div id="baks"></div>
  </div>
</div>
<script src="js/auth.js"></script>
<script>
(function(){
try{if(localStorage.getItem('sbdesk-theme')!=='light')document.body.classList.add('dark');}catch(_){}
function esc(v){return String(v==null?'':v).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
var TFS=['1m','5m','15m','1H','4H'],el=document.getElementById('list');
document.getElementById('out').onclick=function(){SBAuth.signOut();};
// download every note (with After charts) as one file, as a backup
document.getElementById('bak').onclick=function(){SBAuth.notes().then(function(n){
  var b=new Blob([JSON.stringify({saved:new Date().toISOString(),notes:n},null,2)],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='sbdesk-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();
},function(e){alert(e.message);});};
SBAuth.requireAdmin().then(function(m){if(!m)return;
  document.body.classList.remove('wait');
  document.getElementById('who').textContent='Prijavljen: '+m.name;
  load();loadSugs();loadBaks();
});
function load(){
  el.innerHTML='<p class="empty">Učitavam…</p>';
  SBAuth.notes().then(draw,function(e){el.innerHTML='<p class="empty err">'+esc(e.message)+'</p>';});
}
function draw(notes){
  notes=notes.slice().sort(function(a,b){return a.t<b.t?1:-1;});
  if(!notes.length){el.innerHTML='<p class="empty">Još nema objava.</p>';return;}
  el.innerHTML=notes.map(function(x){
    var tf=TFS.filter(function(t){return x.ideas&&x.ideas[t];}).join(' · ');
    return '<div class="row"><div class="when">'+x.t.slice(8,10)+'.'+x.t.slice(5,7)+'.'+x.t.slice(0,4)+'<br>'+x.t.slice(11,16)+' NY</div>'+
      '<div><div class="ttl">'+esc(x.title)+(x.now?'<span class="ok">IMA AFTER</span>':'')+'</div><div class="tfs">'+esc(tf)+(x.by?' · '+esc(x.by):'')+'</div></div>'+
      '<div class="acts2"><a class="btn" href="publish.html?after#after='+encodeURIComponent(x.id)+'">'+(x.now?'↻ Zamijeni After':'+ Dodaj After')+'</a>'+(x.now?'<button type="button" class="btn xbtn" data-x="'+esc(x.id)+'">Slika za X</button>':'')+'</div></div>';
  }).join('');
  [].forEach.call(el.querySelectorAll('[data-x]'),function(b){b.onclick=function(){var n=notes.filter(function(y){return y.id===b.getAttribute('data-x');})[0];makeX(n,b);};});
}
// ---- Before / After picture for X (1600 x 900 PNG) ----
// Slika za X: show the picture with buttons. "Spremi u galeriju" opens the phone's share menu
// (iPhone: "Save Image" -> Photos; Android: Gallery / Photos). A plain download goes to Files.
function showPic(blob,name){
  var url=URL.createObjectURL(blob),file=null;
  try{file=new File([blob],name,{type:'image/png'});}catch(_){}
  var canShare=!!(file&&navigator.canShare&&navigator.canShare({files:[file]}));
  var ov=document.createElement('div');ov.className='picov';
  ov.innerHTML='<div class="picbox"><img alt="Slika za X" src="'+url+'">'+
    (canShare?'<button type="button" class="btn" data-a="share">Spremi u galeriju</button>':'')+
    '<a class="btn line" data-a="dl" href="'+url+'" download="'+name+'">Preuzmi kao datoteku</a>'+
    '<p class="hint">Ili drži prst na slici → Spremi sliku / Save to Photos.</p>'+
    '<button type="button" class="btn line" data-a="x">Zatvori</button></div>';
  function close(){ov.remove();URL.revokeObjectURL(url);}
  ov.onclick=function(e){var t=e.target.closest('[data-a]');if(e.target===ov)return close();if(!t)return;
    var w=t.getAttribute('data-a');
    if(w==='x')close();
    if(w==='share')navigator.share({files:[file]}).catch(function(err){if(err&&err.name!=='AbortError')alert('Nije uspjelo: '+err.message+'. Drži prst na slici i spremi.');});};
  document.body.appendChild(ov);
}
function snap(u){var m=/tradingview\.com\/x\/([A-Za-z0-9]+)/.exec(u||'');return m?'https://s3.tradingview.com/snapshots/'+m[1].charAt(0).toLowerCase()+'/'+m[1]+'.png':null;}
// snapshot (tradingview.com/x/...) or published idea (tradingview.com/chart/.../ID-...) -> our image address
function imgSrc(u){var s=snap(u);if(s)return '/api/img?u='+encodeURIComponent(s);var m=/\/chart\/[^\/]+\/([A-Za-z0-9]+)/.exec(u||'');return m?'/api/img?idea='+m[1]:null;}
function loadImg(src){return new Promise(function(ok,bad){var i=new Image();i.onload=function(){ok(i);};i.onerror=function(){bad(new Error('Slika grafa se ne učitava. Ako je ideja tek objavljena, TradingView ponekad treba par minuta za sliku.'));};i.src=src;});}
function fit(g,img,x,y,w,h){var r=Math.min(w/img.width,h/img.height),iw=img.width*r,ih=img.height*r;g.drawImage(img,x+(w-iw)/2,y+(h-ih)/2,iw,ih);}
function nyLabel(t){return new Date(t.slice(0,10)+'T12:00:00Z').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'})+' · '+t.slice(11,16)+' ET';}
function makeX(n,btn){
  var tf=n.now.tf,bLink=(n.ideas&&n.ideas[tf])||(n.ideas&&n.ideas[TFS.filter(function(t){return n.ideas[t];})[0]]);
  var bs=imgSrc(bLink),as=imgSrc(n.now.link);
  if(!bs||!as){alert('Ne prepoznajem link grafa. Treba TradingView slika (kamera → Copy link) ili objavljena ideja.');return;}
  btn.disabled=true;btn.textContent='Radim sliku…';
  // the fonts must be loaded before drawing, or the phone falls back to a plain system font
  var F=['500 20px "IBM Plex Mono"','700 20px "IBM Plex Mono"','700 20px Inter','800 20px Inter','500 20px Inter','20px "Libre Caslon Display"'];
  var fontsReady=(document.fonts&&document.fonts.load)?Promise.all(F.map(function(f){return document.fonts.load(f);})).catch(function(){}):Promise.resolve();
  Promise.all([loadImg(bs),loadImg(as),loadImg('img/apple-touch-icon.png'),fontsReady]).then(function(im){
    // drawn at 2x (3200 px wide) so the charts stay sharp on X; the layout is in 1600-wide units
    var S=2,W=1600,M=40,GAP=20,pw=(W-2*M-GAP)/2;
    var ar=Math.max(im[0].width/im[0].height,im[1].width/im[1].height);
    var ph=Math.round(Math.min(Math.max(pw/ar,380),620));
    var top=128,head=52,H=top+head+ph+150;
    var c=document.createElement('canvas');c.width=W*S;c.height=H*S;var g=c.getContext('2d');
    g.scale(S,S);g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';
    g.fillStyle='#050505';g.fillRect(0,0,W,H);
    g.drawImage(im[2],M,30,72,72);
    g.fillStyle='#ece6d6';g.font='44px "Libre Caslon Display", Georgia, serif';g.fillText('SB DESK',M+92,82);
    g.fillStyle='#9a9a9a';g.font='500 22px "IBM Plex Mono", monospace';g.textAlign='right';g.fillText('NQ · '+tf,W-M,80);g.textAlign='left';
    [[0,'BEFORE',n.t,im[0],'#ffb000'],[1,'AFTER',n.now.t,im[1],'#22d34a']].forEach(function(p){
      var x=M+p[0]*(pw+GAP),y=top;
      g.fillStyle='#101010';g.fillRect(x,y,pw,head+ph);
      g.fillStyle=p[4];g.fillRect(x,y,pw,4);
      g.font='700 24px "IBM Plex Mono", monospace';g.fillText(p[1],x+16,y+36);
      g.fillStyle='#b5b0a5';g.font='500 19px "IBM Plex Mono", monospace';g.textAlign='right';g.fillText(nyLabel(p[2]),x+pw-16,y+36);g.textAlign='left';
      fit(g,p[3],x,y+head,pw,ph);
    });
    var fy=top+head+ph;
    g.fillStyle='#fff';g.font='800 40px Inter, system-ui, sans-serif';
    var t=n.title;while(g.measureText(t).width>W-2*M&&t.length>10)t=t.slice(0,-2);if(t!==n.title)t=t.replace(/\s*\S*$/,'')+'…';
    g.fillText(t,M,fy+70);
    g.fillStyle='#ffb000';g.font='500 24px "IBM Plex Mono", monospace';g.fillText('sbdesk.com',M,fy+116);
    g.fillStyle='#777';g.font='500 20px Inter, system-ui, sans-serif';g.textAlign='right';g.fillText('Analysis only · not a signal',W-M,fy+116);g.textAlign='left';
    c.toBlob(function(b){showPic(b,'sbdesk-before-after-'+n.t.slice(0,10)+'.png');btn.disabled=false;btn.textContent='Slika za X';},'image/png');
  }).catch(function(e){alert(e.message);btn.disabled=false;btn.textContent='Slika za X';});
}
function loadBaks(){var b=document.getElementById('baks');
  fetch('/api/backups',{credentials:'same-origin',cache:'no-store'}).then(function(r){return r.json();}).then(function(d){var k=d.backups||[];
    b.innerHTML=k.length?k.slice(0,10).map(function(x){return '<a href="/api/backups?key='+encodeURIComponent(x)+'">'+esc(x.replace('sbdesk-',''))+'</a>';}).join(''):'<p class="empty">Prva automatska kopija nastaje večeras.</p>';},function(){b.innerHTML='';});}
function loadSugs(){
  var box=document.getElementById('sugs');box.innerHTML='<p class="empty">Učitavam…</p>';
  fetch('/api/suggestions',{credentials:'same-origin',cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(d){
    var a=d.suggestions||[];document.getElementById('sugN').textContent=a.length?'('+a.length+')':'';
    if(!a.length){box.innerHTML='<p class="empty">Još nema prijedloga.</p>';return;}
    box.innerHTML=a.map(function(x){return '<div class="sg"><div class="meta"><span>'+x.t.slice(8,10)+'.'+x.t.slice(5,7)+'. '+x.t.slice(11,16)+' NY'+(x.name?' · '+esc(x.name):'')+(x.contact?' · '+esc(x.contact):'')+'</span><button type="button" data-id="'+esc(x.id)+'">Obriši</button></div><p>'+esc(x.text)+'</p></div>';}).join('');
    [].forEach.call(box.querySelectorAll('button[data-id]'),function(b){b.onclick=function(){if(!confirm('Obrisati ovaj prijedlog?'))return;
      SBAuth.post('/api/suggestions',{delete:b.getAttribute('data-id')}).then(loadSugs,function(e){alert(e.message);});};});
  },function(){box.innerHTML='<p class="empty err">Ne mogu učitati prijedloge.</p>';});
}
// One-time move of notes that were saved only in this browser (before accounts existed).
function migrate(){
  var old=[],nows={};
  try{old=JSON.parse(localStorage.getItem('sbdesk-demo-notes')||'[]').filter(function(x){return x&&x.t&&x.title&&x.ideas;});}catch(_){}
  try{nows=JSON.parse(localStorage.getItem('sbdesk-demo-now')||'{}');}catch(_){}
  if(!old.length)return;
  var box=document.getElementById('mig');box.hidden=false;
  box.innerHTML='U ovom pregledniku su <b>'+old.length+'</b> stare objave koje još nitko drugi ne vidi.<br><button type="button" id="mv">Prebaci ih na stranicu</button>';
  document.getElementById('mv').onclick=function(){
    var b=this;b.disabled=true;b.textContent='Prebacujem…';
    old.sort(function(a,c){return a.t<c.t?-1:1;});
    var chain=Promise.resolve();
    old.forEach(function(x){chain=chain.then(function(){
      return SBAuth.post('/api/notes',{import:true,t:x.t,kind:x.kind,title:x.title,body:x.body,ideas:x.ideas,now:nows[x.t+'|'+x.title]||null}).then(function(){
        // remove each moved note right away, so a retry never posts it twice
        try{var left=JSON.parse(localStorage.getItem('sbdesk-demo-notes')||'[]').filter(function(y){return !(y&&y.t===x.t&&y.title===x.title);});localStorage.setItem('sbdesk-demo-notes',JSON.stringify(left));
          var done=JSON.parse(localStorage.getItem('sbdesk-demo-notes-prebaceno')||'[]');done.push(x);localStorage.setItem('sbdesk-demo-notes-prebaceno',JSON.stringify(done));}catch(_){}
      });});});
    chain.then(function(){
      try{localStorage.removeItem('sbdesk-demo-notes');}catch(_){}
      box.innerHTML='✓ Prebačeno. Sad ih vide svi.';load();
    },function(e){b.disabled=false;b.textContent='Pokušaj ponovno';box.insertAdjacentHTML('beforeend','<p class="err">✗ '+esc(e.message)+'</p>');});
  };
}
})();
</script>
</body>
</html>
