<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>SB Desk · Log in</title>
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="theme-color" content="#050505">
<style>
:root{--ink:#d8d8d8;--muted:#8a8a8a;--line:#2a2a2a;--card:#000;--bg:#050505;--gold:#ffb000;--dn:#ff4545;--up:#22d34a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 Tahoma,Verdana,sans-serif;padding:16px}
.box{width:min(380px,100%);border:1px solid var(--line);background:var(--card);padding:24px}
h1 svg{color:#ece6d6;flex:none}
h1{margin:0 0 2px;font:700 22px Consolas,"Courier New",monospace;letter-spacing:.08em;color:#fff}
.sub{margin:0 0 18px;color:var(--muted);font-size:14px}
label{display:block;font:600 12px Tahoma,sans-serif;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:12px 0 5px}
input{width:100%;font:17px Tahoma,sans-serif;padding:12px;background:#0a0a0a;color:#fff;border:1px solid #3a3a3a;border-radius:0}
input:focus{outline:2px solid var(--gold);outline-offset:-2px}
button,.btn{display:block;text-align:center;text-decoration:none;margin-top:16px;width:100%;padding:14px;font:700 16px Tahoma,sans-serif;background:var(--gold);color:#000;border:0;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
.google{background:#fff;color:#1f1f1f;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:0}
.or{display:flex;align-items:center;gap:10px;margin:16px 0 0;color:var(--muted);font-size:13px}.or:before,.or:after{content:"";flex:1;border-top:1px solid var(--line)}
.link{display:inline-block;margin-top:14px;color:var(--muted);font-size:14px;background:none;border:0;padding:0;width:auto;cursor:pointer;text-decoration:underline;font-weight:400}
.links{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.msg{margin:12px 0 0;font-size:14px;min-height:1em}.msg.err{color:var(--dn)}.msg.ok{color:var(--up)}
.who{font-size:15px;color:#fff;margin:0}.who small{display:block;color:var(--muted);font-size:13px}
.back{display:inline-block;margin-top:18px;color:var(--muted);font-size:14px}
[hidden]{display:none!important}
</style>
</head>

hor="middle" letter-spacing="1">SB</text><line x1="104" y1="156" x2="156" y2="156" stroke="#ffb000" stroke-width="1.2"></line><text x="131" y="174" font-family="IBM Plex Mono, monospace" font-weight="700" font-size="9.5" letter-spacing="6" fill="#ece6d6" text-anchor="middle">DESK</text><line x1="33.01" y1="186.00" x2="19.15" y2="194.00" stroke="#f23645" stroke-width="5" stroke-linecap="butt"></line><line x1="64.17" y1="220.61" x2="54.76" y2="233.55" stroke="#fdd835" stroke-width="5" stroke-linecap="butt"></line><line x1="106.71" y1="239.55" x2="103.39" y2="255.20" stroke="#9c27b0" stroke-width="5" stroke-linecap="butt"></line><line x1="153.29" y1="239.55" x2="156.61" y2="255.20" stroke="#4fc3f7" stroke-width="5" stroke-linecap="butt"></line><line x1="195.83" y1="220.61" x2="205.24" y2="233.55" stroke="#1e40af" stroke-width="5" stroke-linecap="butt"></line><line x1="226.99" y1="186.00" x2="240.85" y2="194.00" stroke="#ff9800" stroke-width="5" stroke-linecap="butt"></line><text font-family="Libre Caslon Text, serif" font-size="12.5" letter-spacing="3.4" fill="#ece6d6" text-anchor="middle"><textPath href="#s-login" startOffset="50%">SPLIT</textPath></text></svg>SB DESK</h1>
  <p class="sub" id="sub">Log in or create a free account. Every note stays free to read without one.</p>

  <div id="vStart">
    <button type="button" class="google" id="google"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Continue with Google</button>
    <p class="or">or with email</p>
    <form id="fAuth">
      <label for="em">Email</label><input id="em" type="email" autocomplete="username" required>
      <label for="pw" id="pwL">Password</label><input id="pw" type="password" autocomplete="current-password" minlength="8" required>
      <button type="submit" id="go">Log in</button>
      <div class="links"><button type="button" class="link" id="toggle">New here? Create an account</button><button type="button" class="link" id="toForgot">Forgot password?</button></div>
    </form>
  </div>

  <form id="fForgot" hidden>
    <label for="em2">Your email</label><input id="em2" type="email" autocomplete="username" required>
    <button type="submit">Send me a link</button>
    <button type="button" class="link" id="toLogin">← Back</button>
  </form>

  <form id="fNew" hidden>
    <label for="np1">New password (at least 8 characters)</label><input id="np1" type="password" autocomplete="new-password" minlength="8" required>
    <label for="np2">Repeat it</label><input id="np2" type="password" autocomplete="new-password" minlength="8" required>
    <button type="submit">Save password</button>
  </form>

  <div id="vIn" hidden>
    <p class="who">Logged in as <b id="who"></b><small id="whoEm"></small></p>
    <a class="btn" href="/" id="toDesk">Go to the Desk</a>
    <a class="btn" href="admin.html" id="toAdmin" hidden style="background:#1b1b1b;color:#fff">Admin</a>
    <button type="button" class="link" id="out">Log out</button>
  </div>

  <p class="msg" id="msg"></p>
  <a class="back" href="/" id="backLink">← Back to SB Desk</a>
</div>
<script src="js/auth.js"></script>
<script>
(function(){
var A=window.SBAuth,$=function(i){return document.getElementById(i);},msg=$('msg'),sub=$('sub');
var next=new URLSearchParams(location.search).get('next')||'';
if(next&&!/^[a-z]+\.html/.test(next))next='';
var VIEWS=['vStart','fForgot','fNew','vIn'];
function show(id){VIEWS.forEach(function(v){$(v).hidden=v!==id;});$('backLink').hidden=id==='vIn';say('');}
function say(t,kind){msg.textContent=t;msg.className='msg'+(kind?' '+kind:'');}
function busy(form,on){[].forEach.call(form.querySelectorAll('button[type=submit]'),function(b){b.disabled=on;});}
function hr(e){var m=String(e&&e.message||e||'');
  if(/expired|token/i.test(m))return 'This link has expired or was already used. Ask for a new one.';
  if(/not confirmed|confirm/i.test(m))return 'Confirm your email first: open the email we sent and click the link.';
  if(/already|registered|exists/i.test(m))return 'There is already an account with this email. Log in instead.';
  if(/invalid_grant|No user found|Invalid|password/i.test(m))return 'Wrong email or password.';
  return 'Something went wrong: '+m;}
function nameOf(m){return m.name||(m.email||'').split('@')[0];}
// after logging in: the page you came from (admin pages), otherwise your account view
function done(){return A.me().then(function(m){
  if(!m.loggedIn){show('vStart');return;}
  if(next&&(m.admin||next==='index.html')){location.replace(next);return;}
  $('who').textContent=nameOf(m);$('whoEm').textContent=m.email||'';$('toAdmin').hidden=!m.admin;
  sub.textContent='Your SB Desk account.';show('vIn');});}

var signup=false;
$('toggle').onclick=function(){signup=!signup;
  $('go').textContent=signup?'Create account':'Log in';
  $('toggle').textContent=signup?'Have an account? Log in':'New here? Create an account';
  $('pwL').textContent=signup?'Password (at least 8 characters)':'Password';
  $('pw').autocomplete=signup?'new-password':'current-password';$('toForgot').hidden=signup;say('');};
$('toForgot').onclick=function(){show('fForgot');$('em2').value=$('em').value;};
$('toLogin').onclick=function(){show('vStart');};
$('google').onclick=function(){say('Opening Google…');try{A.oauthLogin('google');}catch(e){if(!/Redirecting/i.test(String(e&&e.message)))say(hr(e),'err');}};
$('out').onclick=function(){A.signOut('/');};

$('fAuth').onsubmit=function(e){e.preventDefault();var f=this,em=$('em').value.trim(),pw=$('pw').value;busy(f,true);
  if(signup){say('Creating your account…');
    A.signup(em,pw).then(function(){say('Done. Check your email ('+em+') and click the link to confirm.','ok');busy(f,false);},
      function(err){say(hr(err),'err');busy(f,false);});return;}
  say('Logging in…');
  A.login(em,pw).then(done).then(function(){busy(f,false);},function(err){say(hr(err),'err');busy(f,false);});};

$('fForgot').onsubmit=function(e){e.preventDefault();var f=this;busy(f,true);
  A.requestPasswordRecovery($('em2').value.trim())
   .then(function(){say('If there is an account with this email, we sent a link. Open the email and click it.','ok');},function(err){say(hr(err),'err');})
   .then(function(){busy(f,false);});};

var mode=null,inviteToken=null;
$('fNew').onsubmit=function(e){e.preventDefault();var f=this,a=$('np1').value,b=$('np2').value;
  if(a.length<8)return say('The password needs at least 8 characters.','err');
  if(a!==b)return say('The two passwords are not the same.','err');
  busy(f,true);say('Saving…');
  var p=mode==='invite'?A.acceptInvite(inviteToken,a):A.updateUser({password:a});
  p.then(function(){say('✓ Password saved.','ok');setTimeout(done,600);},function(err){say(hr(err),'err');busy(f,false);});};

// links from our emails (confirm account, invite, password reset) and Google arrive with a token
A.handleAuthCallback().then(function(r){
  if(r&&r.type==='invite'){mode='invite';inviteToken=r.token;show('fNew');sub.textContent='Welcome. Choose your password.';return;}
  if(r&&r.type==='recovery'){mode='recovery';show('fNew');sub.textContent='Choose a new password.';return;}
  if(r&&r.user)return done();
  return A.getUser().then(function(u){if(u)return done();});
},function(err){say(hr(err),'err');});
})();
</script>
</body>
</html>
