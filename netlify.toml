# Admin pages got English names (23 Nov 2026); old addresses keep working.
[[redirects]]
  from = "/prijava.html"
  to = "/login.html"
  status = 301
  force = true
[[redirects]]
  from = "/objavi.html"
  to = "/publish.html"
  status = 301
  force = true

# The early-access page is gone (20 Nov 2026: every note is free for everyone).
# Its old addresses go to the Desk, so links already shared keep working.
[[redirects]]
  from = "/pristup.html"
  to = "/"
  status = 301
  force = true
[[redirects]]
  from = "/early-access"
  to = "/"
  status = 301
  force = true
[[redirects]]
  from = "/early-access/*"
  to = "/"
  status = 301
  force = true

# Netlify builds the site from this repository.
# Push to main -> live on sbdesk.com.
[build]
  command = "npm run build"
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Basic security for every page
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000"

# Admin and login pages stay out of search engines.
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/publish.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/login.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

# Images and icons change rarely
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
