<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SB Desk — admin</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
:root{
  --bg:#0B0F14; --panel:#141A21; --panel-alt:#1B232C; --border:#262F39;
  --text:#E7ECF1; --text-dim:#8B96A3; --text-faint:#59636F;
  --bull:#4FD1A0; --bear:#E2594F; --amber:#D9A441;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{ background:var(--bg); color:var(--text); font-family:'Space Grotesk',sans-serif; }
.wrap{ max-width:760px; margin:0 auto; padding:32px 24px 80px; }
.topbar{ display:flex; justify-content:space-between; align-items:center; padding-bottom:18px; border-bottom:1px solid var(--border); margin-bottom:20px; }
.mark{ font-size:17px; font-weight:700; }
.mark span{ color:var(--amber); font-family:'IBM Plex Mono',monospace; font-size:11px; margin-left:8px; border:1px solid var(--border); padding:2px 8px; }
.save-btn{ font-family:'IBM Plex Mono',monospace; font-size:12px; background:var(--amber); color:#0B0F14; border:none; padding:9px 16px; cursor:pointer; font-weight:600; }
.status-msg{ font-family:'IBM Plex Mono',monospace; font-size:12px; margin-bottom:20px; padding:10px 14px; border:1px solid var(--border); background:var(--panel-alt); }
.status-msg.ok{ color:var(--bull); border-color:var(--bull); }
.status-msg.err{ color:var(--bear); border-color:var(--bear); }

.instrument-row{ display:flex; gap:6px; margin-bottom:24px; }
.instrument-btn{ font-family:'IBM Plex Mono',monospace; font-size:13px; background:var(--panel-alt); border:1px solid var(--border); color:var(--text-dim); padding:8px 16px; cursor:pointer; flex:1; }
.instrument-btn.active{ color:var(--text); border-color:var(--amber); background:var(--panel); }

.section-label{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:10px; }

.trade-row{ background:var(--panel); border:1px solid var(--border); padding:16px; margin-bottom:28px; }
.trade-pos{ display:flex; gap:6px; margin-bottom:12px; }
.pos-btn{ font-family:'IBM Plex Mono',monospace; font-size:12px; background:var(--panel-alt); border:1px solid var(--border); color:var(--text-faint); padding:6px 14px; cursor:pointer; }
.pos-btn.active[data-pos="FLAT"]{ color:var(--text-dim); border-color:var(--text-faint); }
.pos-btn.active[data-pos="LONG"]{ color:var(--bull); border-color:var(--bull); background:rgba(79,209,160,0.1); }
.pos-btn.active[data-pos="SHORT"]{ color:var(--bear); border-color:var(--bear); background:rgba(226,89,79,0.1); }
.shot{ width:100%; aspect-ratio:16/7; background:var(--panel-alt); border:1px dashed var(--border); position:relative; display:flex; align-items:center; justify-content:center; color:var(--text-faint); font-size:12px; cursor:pointer; overflow:hidden; }
.shot img{ width:100%; height:100%; object-fit:cover; }
.remove-btn{ position:absolute; top:6px; right:6px; font-family:'IBM Plex Mono',monospace; font-size:10px; background:rgba(226,89,79,0.15); border:1px solid var(--bear); color:var(--bear); padding:3px 8px; cursor:pointer; z-index:2; }

.grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.card{ background:var(--panel); border:1px solid var(--border); padding:14px; }
.card-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.card-tf{ font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:600; }
.grade-select{ display:flex; gap:4px; }
.grade-opt{ font-family:'IBM Plex Mono',monospace; font-size:10px; background:var(--panel-alt); border:1px solid var(--border); color:var(--text-faint); padding:3px 8px; cursor:pointer; }
.grade-opt.active[data-g="bull"]{ color:var(--bull); border-color:var(--bull); }
.grade-opt.active[data-g="bear"]{ color:var(--bear); border-color:var(--bear); }
.grade-opt.active[data-g="neutral"]{ color:var(--text-dim); border-color:var(--text-faint); }
.card-shot{ width:100%; aspect-ratio:16/10; background:var(--panel-alt); border:1px dashed var(--border); position:relative; display:flex; align-items:center; justify-content:center; color:var(--text-faint); font-size:11px; cursor:pointer; overflow:hidden; margin-bottom:10px; }
.card-note{ width:100%; background:var(--panel-alt); border:1px solid var(--border); color:var(--text); font-family:'Space Grotesk',sans-serif; font-size:13px; padding:9px 10px; min-height:56px; resize:vertical; }
.card-note::placeholder{ color:var(--text-faint); }
@media (max-width:560px){ .grid{ grid-template-columns:1fr; } }

.login-screen{ max-width:360px; margin:120px auto 0; text-align:center; }
.login-screen .mark{ margin-bottom:24px; }
.login-screen input{ width:100%; background:var(--panel-alt); border:1px solid var(--border); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:14px; padding:11px 14px; margin-bottom:10px; }
.login-screen button{ width:100%; font-family:'IBM Plex Mono',monospace; font-size:13px; background:var(--amber); color:#0B0F14; border:none; padding:11px; cursor:pointer; font-weight:600; }
.login-screen button:disabled{ opacity:0.5; }
.hidden{ display:none !important; }
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="mark">SB Desk<span>admin</span></div>
  <input type="password" id="loginPwInput" placeholder="Admin password">
  <button id="loginBtn">log in</button>
  <div id="loginStatus" style="margin-top:14px; font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--bear);"></div>
</div>

<div class="wrap hidden" id="adminWrap">
  <div class="topbar">
    <div class="mark">SB Desk<span>admin</span></div>
    <button class="save-btn" id="saveBtn">save & publish</button>
  </div>

  <div id="statusMsg"></div>

  <div class="instrument-row" id="instrumentRow">
    <button class="instrument-btn active" data-inst="NQ">Nasdaq</button>
    <button class="instrument-btn" data-inst="GOLD">Gold</button>
    <button class="instrument-btn" data-inst="DOW">Dow</button>
  </div>

  <div class="section-label">Current trade</div>
  <div class="trade-row">
    <div class="trade-pos" id="tradePos">
      <button class="pos-btn active" data-pos="FLAT">flat</button>
      <button class="pos-btn" data-pos="LONG">long</button>
      <button class="pos-btn" data-pos="SHORT">short</button>
    </div>
    <div class="shot" id="tradeShot">click to upload broker screenshot</div>
    <input type="file" id="tradeFile" accept="image/*" style="display:none">
  </div>

  <div class="section-label">Timeframes</div>
  <div class="grid" id="tfGrid"></div>
</div>

<script>
const API_BASE = 'https://sbdesk-api.onrender.com';
const tfs=['1m','5m','15m','1h','4h','1D'];
const INSTRUMENTS=['NQ','GOLD','DOW'];

function emptyTimeframes(){
  const o={}; tfs.forEach(t=> o[t]={grade:'neutral', note:'', img:null}); return o;
}
function emptyInstrumentState(){
  return { trade:{ position:'FLAT', img:null, history:[] }, timeframes: emptyTimeframes() };
}

let fullState={}; INSTRUMENTS.forEach(k=> fullState[k]=emptyInstrumentState());
let currentInstrument='NQ';
let adminPassword='';

const statusMsg=document.getElementById('statusMsg');
const saveBtn=document.getElementById('saveBtn');
function showStatus(msg, kind){
  statusMsg.textContent=msg;
  statusMsg.className='status-msg '+(kind||'');
}

function fileToDataUrl(file){
  return new Promise((resolve, reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

const tradeShot=document.getElementById('tradeShot');
const tradeFile=document.getElementById('tradeFile');
const tradePos=document.getElementById('tradePos');
const tfGrid=document.getElementById('tfGrid');

function currentSlice(){ return fullState[currentInstrument]; }

function renderTradeShot(){
  const s=currentSlice();
  tradeShot.innerHTML = s.trade.img
    ? `<button class="remove-btn" id="removeTradeShot">remove</button><img src="${s.trade.img}">`
    : 'click to upload broker screenshot';
  if(s.trade.img){
    document.getElementById('removeTradeShot').addEventListener('click',(e)=>{
      e.stopPropagation(); s.trade.img=null; renderTradeShot();
    });
  }
}
tradeShot.addEventListener('click',(e)=>{ if(e.target.classList.contains('remove-btn')) return; tradeFile.click(); });
tradeFile.addEventListener('change', async ()=>{
  if(tradeFile.files[0]){
    currentSlice().trade.img = await fileToDataUrl(tradeFile.files[0]);
    renderTradeShot();
  }
});
tradePos.querySelectorAll('.pos-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    currentSlice().trade.position = btn.dataset.pos;
    tradePos.querySelectorAll('.pos-btn').forEach(b=>b.classList.toggle('active', b===btn));
  });
});

function renderGrid(){
  const s=currentSlice();
  tfGrid.innerHTML='';
  tfs.forEach(t=>{
    const tf=s.timeframes[t];
    const c=document.createElement('div'); c.className='card';
    c.innerHTML=`<div class="card-head"><div class="card-tf">${t}</div>
        <div class="grade-select">
          <button class="grade-opt ${tf.grade==='bull'?'active':''}" data-g="bull">bull</button>
          <button class="grade-opt ${tf.grade==='bear'?'active':''}" data-g="bear">bear</button>
          <button class="grade-opt ${tf.grade==='neutral'?'active':''}" data-g="neutral">–</button>
        </div></div>
      <div class="card-shot">${tf.img?`<button class="remove-btn" data-remove="${t}">remove</button><img src="${tf.img}">`:'click to upload'}</div>
      <textarea class="card-note" placeholder="Notes for ${t}...">${tf.note}</textarea>`;
    c.querySelectorAll('.grade-opt').forEach(btn=>{
      btn.addEventListener('click',()=>{ tf.grade=btn.dataset.g; renderGrid(); });
    });
    const removeBtn=c.querySelector('.remove-btn');
    if(removeBtn){
      removeBtn.addEventListener('click',(e)=>{ e.stopPropagation(); tf.img=null; renderGrid(); });
    }
    c.querySelector('.card-shot').addEventListener('click',(e)=>{
      if(e.target.classList.contains('remove-btn')) return;
      const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
      inp.onchange=async ()=>{ if(inp.files[0]){ tf.img=await fileToDataUrl(inp.files[0]); renderGrid(); } };
      inp.click();
    });
    c.querySelector('.card-note').addEventListener('input',(e)=>{ tf.note=e.target.value; });
    tfGrid.appendChild(c);
  });
}

function renderInstrumentPanel(){
  const s=currentSlice();
  tradePos.querySelectorAll('.pos-btn').forEach(b=>b.classList.toggle('active', b.dataset.pos===s.trade.position));
  renderTradeShot();
  renderGrid();
}

document.querySelectorAll('.instrument-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    currentInstrument=btn.dataset.inst;
    document.querySelectorAll('.instrument-btn').forEach(b=>b.classList.toggle('active', b===btn));
    renderInstrumentPanel();
  });
});

// login
const loginBtn=document.getElementById('loginBtn');
const loginPwInput=document.getElementById('loginPwInput');
const loginStatus=document.getElementById('loginStatus');
const loginScreen=document.getElementById('loginScreen');
const adminWrap=document.getElementById('adminWrap');

async function attemptLogin(){
  const pw=loginPwInput.value.trim();
  if(!pw){ loginStatus.textContent='Enter a password.'; return; }
  loginBtn.disabled=true;
  loginStatus.textContent='Checking…';
  try{
    const res=await fetch(`${API_BASE}/api/admin/login`, { method:'POST', headers:{ 'x-admin-password':pw } });
    if(res.status===401){ loginStatus.textContent='Wrong password.'; loginBtn.disabled=false; return; }
    if(!res.ok) throw new Error('server returned '+res.status);
    adminPassword=pw;
    loginScreen.classList.add('hidden');
    adminWrap.classList.remove('hidden');
    await loadCurrentState();
  }catch(err){
    loginStatus.textContent='Login failed: '+err.message;
    loginBtn.disabled=false;
  }
}
loginBtn.addEventListener('click', attemptLogin);
loginPwInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') attemptLogin(); });

async function loadCurrentState(){
  showStatus('Loading current state…', '');
  try{
    const res=await fetch(`${API_BASE}/api/state`);
    const data=await res.json();
    INSTRUMENTS.forEach(k=>{
      if(data[k]) fullState[k]={ trade: data[k].trade || {position:'FLAT', img:null, history:[]}, timeframes: data[k].timeframes || emptyTimeframes() };
    });
    renderInstrumentPanel();
    showStatus('Loaded. Pick an instrument tab, make edits, then save & publish.', 'ok');
  }catch(err){
    showStatus('Failed to load state: '+err.message, 'err');
    console.error(err);
  }
}

saveBtn.addEventListener('click', async ()=>{
  if(!adminPassword){ showStatus('Not logged in.', 'err'); return; }
  saveBtn.disabled=true;
  showStatus('Saving…', '');
  const s=currentSlice();
  const payload={ instrument: currentInstrument, trade: s.trade, timeframes: s.timeframes };
  try{
    const res=await fetch(`${API_BASE}/api/admin/save`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'x-admin-password':adminPassword },
      body: JSON.stringify(payload)
    });
    if(res.status===401){ showStatus('Wrong password — not saved.', 'err'); saveBtn.disabled=false; return; }
    if(!res.ok){ throw new Error('server returned '+res.status); }
    showStatus(`Published ${currentInstrument}. The live site now shows this.`, 'ok');
  }catch(err){
    showStatus('Failed to save: '+err.message, 'err');
  }
  saveBtn.disabled=false;
});
</script>
</body>
</html>
